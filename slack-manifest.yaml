display_information:
  name: Fired Events
  description: Delivers #fired messages to the Fired agent on its Sprite. Replies come from sprites_bot.
features:
  bot_user:
    display_name: fired-events
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:history
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
